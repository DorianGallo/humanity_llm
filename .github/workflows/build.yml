name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: Generate release keystore
        run: |
          keytool -genkey -v -keystore ${{ github.workspace }}/release.keystore \
            -alias release -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=HumanityLLM,O=Dev,C=US" \
            -storepass humanityllm -keypass humanityllm

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
          SIGNING_STORE_PASSWORD: humanityllm
          SIGNING_KEY_ALIAS: release
          SIGNING_KEY_PASSWORD: humanityllm

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/humanityLlm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: humanityLlm
          path: app/build/outputs/apk/release/humanityLlm.apk

      - name: Delete existing latest release
        run: gh release delete latest --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        run: |
          gh release create latest \
            --title "Latest Build" \
            --notes "Auto-built from commit ${{ github.sha }}" \
            --prerelease \
            app/build/outputs/apk/release/humanityLlm.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
